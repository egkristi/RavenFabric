name: Release

on:
  push:
    tags:
      - 'v*'

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.artifact }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            artifact: ravenfabric-linux-amd64
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            artifact: ravenfabric-linux-amd64-musl
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            artifact: ravenfabric-linux-arm64
          - target: x86_64-apple-darwin
            os: macos-latest
            artifact: ravenfabric-darwin-amd64
          - target: aarch64-apple-darwin
            os: macos-latest
            artifact: ravenfabric-darwin-arm64
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install cross-compilation tools
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Install musl tools
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get install -y musl-tools

      - name: Build rf-agent
        run: cargo build --release --target ${{ matrix.target }} -p rf-agent
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc

      - name: Build rf-relay
        run: cargo build --release --target ${{ matrix.target }} -p rf-relay
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc

      - name: Build rf-cli
        run: cargo build --release --target ${{ matrix.target }} -p rf-cli
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc

      - name: Package binaries
        shell: bash
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/rf-agent dist/${{ matrix.artifact }}-agent || true
          cp target/${{ matrix.target }}/release/rf-relay dist/${{ matrix.artifact }}-relay || true
          cp target/${{ matrix.target }}/release/rf dist/${{ matrix.artifact }}-cli || true

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/

  release:
    name: Create Release
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Flatten artifacts
        run: |
          mkdir -p release
          find artifacts -type f -exec cp {} release/ \;
          ls -la release/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true

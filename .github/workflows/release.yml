name: Release

on:
  push:
    tags:
      - 'v*'

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.artifact }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            artifact: ravenfabric-linux-amd64
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            artifact: ravenfabric-linux-amd64-musl
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            artifact: ravenfabric-linux-arm64
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            artifact: ravenfabric-linux-arm64-musl
          - target: x86_64-apple-darwin
            os: macos-13
            artifact: ravenfabric-darwin-amd64
          - target: aarch64-apple-darwin
            os: macos-latest
            artifact: ravenfabric-darwin-arm64
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            artifact: ravenfabric-windows-amd64
          - target: armv7-unknown-linux-musleabihf
            os: ubuntu-latest
            artifact: ravenfabric-linux-armv7-musl
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Ensure target is installed
        run: rustup target add ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install cross-compilation tools
        if: contains(matrix.target, 'aarch64-unknown-linux') || contains(matrix.target, 'armv7')
        run: |
          sudo apt-get update
          if [[ "${{ matrix.target }}" == "aarch64-unknown-linux-gnu" ]]; then
            sudo apt-get install -y gcc-aarch64-linux-gnu
          fi
          if [[ "${{ matrix.target }}" == "armv7-unknown-linux-musleabihf" ]]; then
            wget --retry-connrefused --tries=5 --timeout=30 https://musl.cc/armv7l-linux-musleabihf-cross.tgz
            tar xzf armv7l-linux-musleabihf-cross.tgz -C /opt
            echo "/opt/armv7l-linux-musleabihf-cross/bin" >> $GITHUB_PATH
          fi

      - name: Install musl tools
        if: contains(matrix.target, 'musl')
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools
          if [[ "${{ matrix.target }}" == "aarch64-unknown-linux-musl" ]]; then
            sudo apt-get install -y gcc-aarch64-linux-gnu musl-dev
            # Install aarch64 musl cross toolchain
            wget --retry-connrefused --tries=5 --timeout=30 https://musl.cc/aarch64-linux-musl-cross.tgz
            tar xzf aarch64-linux-musl-cross.tgz -C /opt
            echo "/opt/aarch64-linux-musl-cross/bin" >> $GITHUB_PATH
          fi

      - name: Build rf-agent
        run: cargo build --release --target ${{ matrix.target }} -p rf-agent
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER: aarch64-linux-musl-gcc
          CARGO_TARGET_ARMV7_UNKNOWN_LINUX_MUSLEABIHF_LINKER: armv7l-linux-musleabihf-gcc

      - name: Build rf-relay
        run: cargo build --release --target ${{ matrix.target }} -p rf-relay
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER: aarch64-linux-musl-gcc
          CARGO_TARGET_ARMV7_UNKNOWN_LINUX_MUSLEABIHF_LINKER: armv7l-linux-musleabihf-gcc

      - name: Build rf-cli
        run: cargo build --release --target ${{ matrix.target }} -p rf-cli
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER: aarch64-linux-musl-gcc
          CARGO_TARGET_ARMV7_UNKNOWN_LINUX_MUSLEABIHF_LINKER: armv7l-linux-musleabihf-gcc

      - name: Package binaries
        shell: bash
        run: |
          mkdir -p dist
          if [[ "${{ matrix.os }}" == "windows-latest" ]]; then
            cp target/${{ matrix.target }}/release/rf-agent.exe dist/${{ matrix.artifact }}-agent.exe
            cp target/${{ matrix.target }}/release/rf-relay.exe dist/${{ matrix.artifact }}-relay.exe
            cp target/${{ matrix.target }}/release/rf.exe dist/${{ matrix.artifact }}-cli.exe
          else
            cp target/${{ matrix.target }}/release/rf-agent dist/${{ matrix.artifact }}-agent
            cp target/${{ matrix.target }}/release/rf-relay dist/${{ matrix.artifact }}-relay
            cp target/${{ matrix.target }}/release/rf dist/${{ matrix.artifact }}-cli
          fi

      - name: Create portable ZIP (Windows)
        if: matrix.os == 'windows-latest'
        shell: bash
        run: |
          mkdir -p zip-staging
          cp target/${{ matrix.target }}/release/rf-agent.exe zip-staging/
          cp target/${{ matrix.target }}/release/rf-relay.exe zip-staging/
          cp target/${{ matrix.target }}/release/rf.exe zip-staging/
          cp README.md zip-staging/
          cp CHANGELOG.md zip-staging/ 2>/dev/null || true
          cd zip-staging && 7z a -tzip ../dist/ravenfabric-windows-x64.zip . && cd ..

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: dist/

  release:
    name: Create Release
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v8
        with:
          path: artifacts/

      - name: Flatten artifacts
        run: |
          mkdir -p release
          find artifacts -type f -exec cp {} release/ \;
          ls -la release/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: release/*
          generate_release_notes: true

  packages:
    name: Build Linux packages
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Install packaging tools
        run: cargo install cargo-deb cargo-generate-rpm

      - name: Build binaries
        run: cargo build --release -p rf-agent -p rf-relay -p rf-cli

      - name: Build .deb packages
        run: |
          cargo deb -p rf-agent --no-build
          cargo deb -p rf-relay --no-build
          cargo deb -p rf-cli --no-build

      - name: Build .rpm packages
        run: |
          cargo generate-rpm -p crates/rf-agent
          cargo generate-rpm -p crates/rf-relay
          cargo generate-rpm -p crates/rf-cli

      - name: Collect packages
        run: |
          mkdir -p packages
          cp target/debian/*.deb packages/
          cp target/generate-rpm/*.rpm packages/
          ls -la packages/

      - name: Upload packages to release
        uses: softprops/action-gh-release@v3
        with:
          files: packages/*

  homebrew:
    name: Update Homebrew Tap
    needs: [release]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts/

      - name: Compute SHA256 hashes
        id: hashes
        run: |
          SHA_DARWIN_ARM64=$(sha256sum artifacts/ravenfabric-darwin-arm64/ravenfabric-darwin-arm64-cli | awk '{print $1}')
          SHA_DARWIN_AMD64=$(sha256sum artifacts/ravenfabric-darwin-amd64/ravenfabric-darwin-amd64-cli | awk '{print $1}')
          SHA_LINUX_AMD64=$(sha256sum artifacts/ravenfabric-linux-amd64-musl/ravenfabric-linux-amd64-musl-cli | awk '{print $1}')
          SHA_LINUX_ARM64=$(sha256sum artifacts/ravenfabric-linux-arm64-musl/ravenfabric-linux-arm64-musl-cli | awk '{print $1}')
          echo "darwin_arm64=$SHA_DARWIN_ARM64" >> "$GITHUB_OUTPUT"
          echo "darwin_amd64=$SHA_DARWIN_AMD64" >> "$GITHUB_OUTPUT"
          echo "linux_amd64=$SHA_LINUX_AMD64" >> "$GITHUB_OUTPUT"
          echo "linux_arm64=$SHA_LINUX_ARM64" >> "$GITHUB_OUTPUT"

      - name: Get version
        id: version
        run: echo "tag=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Generate formula
        run: |
          mkdir -p homebrew-tap/Formula
          cat > homebrew-tap/Formula/ravenfabric.rb <<EOF
          class Ravenfabric < Formula
            desc "Secure remote execution and mesh networking agent"
            homepage "https://ravenfabric.io"
            version "${{ steps.version.outputs.tag }}"
            license "AGPL-3.0-or-later"

            on_macos do
              if Hardware::CPU.arm?
                url "https://github.com/egkristi/RavenFabric/releases/download/v${{ steps.version.outputs.tag }}/ravenfabric-darwin-arm64-cli"
                sha256 "${{ steps.hashes.outputs.darwin_arm64 }}"
              else
                url "https://github.com/egkristi/RavenFabric/releases/download/v${{ steps.version.outputs.tag }}/ravenfabric-darwin-amd64-cli"
                sha256 "${{ steps.hashes.outputs.darwin_amd64 }}"
              end
            end

            on_linux do
              if Hardware::CPU.arm?
                url "https://github.com/egkristi/RavenFabric/releases/download/v${{ steps.version.outputs.tag }}/ravenfabric-linux-arm64-musl-cli"
                sha256 "${{ steps.hashes.outputs.linux_arm64 }}"
              else
                url "https://github.com/egkristi/RavenFabric/releases/download/v${{ steps.version.outputs.tag }}/ravenfabric-linux-amd64-musl-cli"
                sha256 "${{ steps.hashes.outputs.linux_amd64 }}"
              end
            end

            def install
              bin.install Dir.glob("ravenfabric-*").first => "rf"
            end

            test do
              assert_match version.to_s, shell_output("#{bin}/rf --version")
            end
          end
          EOF
          # Fix indentation — remove leading 10 spaces from heredoc
          sed -i 's/^          //' homebrew-tap/Formula/ravenfabric.rb

      - name: Push to homebrew-tap
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          cd homebrew-tap
          git init
          git remote add origin https://x-access-token:${TAP_TOKEN}@github.com/egkristi/homebrew-tap.git
          git fetch origin main
          git checkout main
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/ravenfabric.rb
          git commit -m "feat: update ravenfabric to ${{ steps.version.outputs.tag }}"
          git push origin main

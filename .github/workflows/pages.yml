name: Deploy Website to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Validate HTML structure
        working-directory: website
        run: |
          test -f index.html || { echo "index.html missing"; exit 1; }
          test -f CNAME || { echo "CNAME missing"; exit 1; }
          test -f assets/favicon.svg || { echo "favicon missing"; exit 1; }
          test -f assets/og-image.png || { echo "og-image missing"; exit 1; }
          echo "Required files present"

          if grep -r "localhost\|127.0.0.1" --include="*.html" .; then
            echo "Found localhost references"
            exit 1
          fi
          echo "No localhost references"

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Install mdBook
        run: |
          curl -sSL https://github.com/rust-lang/mdBook/releases/latest/download/mdbook-v0.4.44-x86_64-unknown-linux-gnu.tar.gz | tar xz
          chmod +x mdbook
          sudo mv mdbook /usr/local/bin/

      - name: Build documentation
        working-directory: docs
        run: mdbook build

      - name: Copy docs into website
        run: cp -r docs/book website/docs

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'website'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

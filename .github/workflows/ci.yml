name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      RUSTFLAGS: "-Dwarnings"
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --all-targets

  fmt:
    name: Format
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets -- -D warnings

  test:
    name: Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      RUSTFLAGS: "-Dwarnings"
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --all

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    permissions:
      contents: read
    needs: [test]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-llvm-cov
        run: cargo install cargo-llvm-cov --locked
      - name: Generate coverage
        run: |
          cargo llvm-cov --all-features --workspace \
            --ignore-filename-regex "(crates/rf-cli/|crates/rf-agent/|crates/rf-relay/)" \
            --codecov --output-path codecov.json 2>&1 | tee coverage-output.txt
          # Also produce summary for the log
          cargo llvm-cov --all-features --workspace \
            --ignore-filename-regex "(crates/rf-cli/|crates/rf-agent/|crates/rf-relay/)" \
            --summary-only 2>&1 | tee coverage-summary.txt
          COVERAGE=$(grep -oP 'TOTAL.*?(\d+\.\d+)%' coverage-summary.txt | grep -oP '\d+\.\d+' | tail -1)
          echo "Coverage: ${COVERAGE}%"
          # Fail if coverage drops below 60%
          awk "BEGIN {exit (${COVERAGE:-0} < 60.0) ? 1 : 0}"
      - name: Upload to Codecov
        uses: codecov/codecov-action@v6
        with:
          files: codecov.json
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  msrv:
    name: MSRV (1.88)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.88.0"
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --all-targets

  cross-compile:
    name: Cross-compile (${{ matrix.target }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        target:
          - armv7-unknown-linux-musleabihf
          - riscv64gc-unknown-linux-gnu
          - x86_64-unknown-freebsd
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Install cross
        run: cargo install cross --git https://github.com/cross-rs/cross
      - name: Cross-check
        run: cross check --target ${{ matrix.target }} -p rf-crypto -p rf-transport -p rf-rpc -p rf-audit -p rf-policy -p rf-executor -p rf-bootstrap

  binary-size:
    name: Binary Size Gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    needs: [check]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: binary-size
      - name: Build release binaries
        run: cargo build --release -p rf-agent -p rf-relay -p rf-cli
      - name: Check binary sizes (< 15 MB)
        run: |
          MAX_SIZE=$((15 * 1024 * 1024))
          FAILED=0
          for bin in rf-agent rf-relay rf; do
            SIZE=$(stat --format=%s "target/release/$bin" 2>/dev/null || echo 0)
            SIZE_MB=$(awk "BEGIN {printf \"%.2f\", $SIZE / 1048576}")
            if [ "$SIZE" -gt "$MAX_SIZE" ]; then
              echo "FAIL: $bin is ${SIZE_MB} MB (limit: 15 MB)"
              FAILED=1
            else
              echo "OK: $bin is ${SIZE_MB} MB"
            fi
          done
          if [ "$FAILED" -eq 1 ]; then
            echo "Binary size gate failed — one or more binaries exceed 15 MB"
            exit 1
          fi

  no-std-wasm:
    name: no_std + WASM
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip1
      - run: rustup target add wasm32-wasip1
      - uses: Swatinem/rust-cache@v2
        with:
          key: no-std-wasm
      - name: Check rf-crypto no_std
        run: cargo check -p rf-crypto --no-default-features
      - name: Check rf-crypto WASM
        run: cargo check -p rf-crypto --no-default-features --target wasm32-wasip1

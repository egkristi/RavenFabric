[package]
name = "rf-cli"
description = "RavenFabric — CLI client (rf)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
rust-version.workspace = true
categories = ["command-line-utilities", "network-programming"]
keywords = ["security", "remote-execution", "mesh-networking", "noise-protocol", "zero-trust"]

[[bin]]
name = "rf"
path = "src/main.rs"

[package.metadata.deb]
maintainer = "Erling Kristiansen <erling@ravenfabric.io>"
section = "net"
priority = "optional"
assets = [
    ["target/release/rf", "usr/bin/", "755"],
]

[package.metadata.generate-rpm]
assets = [
    { source = "target/release/rf", dest = "/usr/bin/rf", mode = "755" },
]

[dependencies]
rf-crypto = { path = "../rf-crypto", version = "0.25.3" }
rf-transport = { path = "../rf-transport", version = "0.25.3" }
rf-rpc = { path = "../rf-rpc", version = "0.25.3" }
rf-relay = { path = "../rf-relay" }
rf-executor = { path = "../rf-executor", version = "0.25.3" }
rf-policy = { path = "../rf-policy", version = "0.25.3" }
rf-audit = { path = "../rf-audit", version = "0.25.3" }
tokio = { workspace = true }
tokio-util = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter"] }
clap = { workspace = true, features = ["env"] }
clap_complete = { workspace = true }
anyhow = { workspace = true }
hex = { workspace = true }
uuid = { workspace = true }
sha2 = { workspace = true }
serde_yaml = { workspace = true }
httparse = { workspace = true }
glob = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

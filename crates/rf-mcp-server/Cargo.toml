[package]
name = "rf-mcp-server"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
description = "RavenFabric MCP (Model Context Protocol) server — policy-controlled AI agent access"

[features]
default = ["full"]
full = ["rf-executor/sysinfo"]
minimal = []
http-sse = ["dep:axum", "dep:tokio-stream", "dep:futures-util"]

[dependencies]
rf-crypto = { path = "../rf-crypto", version = "0.17.0" }
rf-policy = { path = "../rf-policy", version = "0.17.0" }
rf-audit = { path = "../rf-audit", version = "0.17.0" }
rf-executor = { path = "../rf-executor", version = "0.17.0" }
rf-rpc = { path = "../rf-rpc", version = "0.17.0" }

tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
clap = { version = "4", features = ["derive", "env"] }
chrono = { workspace = true }
uuid = { workspace = true }
sha2 = { workspace = true }
regex = { workspace = true }

# HTTP+SSE transport (optional)
axum = { version = "0.8", optional = true }
tokio-stream = { version = "0.1", features = ["sync"], optional = true }
futures-util = { version = "0.3", optional = true }

[dev-dependencies]
tempfile = { workspace = true }

[lints]
workspace = true

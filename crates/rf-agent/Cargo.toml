[package]
name = "rf-agent"
description = "RavenFabric — Agent binary"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
rust-version.workspace = true
categories = ["command-line-utilities", "network-programming"]
keywords = ["security", "remote-execution", "mesh-networking", "noise-protocol", "zero-trust"]

[features]
default = ["full"]
full = ["rf-transport/quic", "rf-executor/sysinfo"]
minimal = []
rt-single-thread = []

[dependencies]
rf-crypto = { path = "../rf-crypto", version = "0.8.0" }
rf-transport = { path = "../rf-transport", version = "0.8.0" }
rf-rpc = { path = "../rf-rpc", version = "0.8.0" }
rf-executor = { path = "../rf-executor", version = "0.8.0" }
rf-policy = { path = "../rf-policy", version = "0.8.0" }
rf-audit = { path = "../rf-audit", version = "0.8.0" }
rf-bootstrap = { path = "../rf-bootstrap", version = "0.8.0" }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
clap = { workspace = true }
anyhow = { workspace = true }
hex = { workspace = true }
serde = { workspace = true }
serde_yaml = { workspace = true }
toml = { workspace = true }
rand = { workspace = true }
chrono = { workspace = true }

[package.metadata.deb]
maintainer = "Erling Kristiansen <erling@ravenfabric.io>"
section = "net"
priority = "optional"
assets = [
    ["target/release/rf-agent", "usr/bin/", "755"],
    ["../../deploy/rf-agent.service", "usr/lib/systemd/system/", "644"],
]
conf-files = ["/etc/ravenfabric/policy.yaml"]

[package.metadata.generate-rpm]
assets = [
    { source = "target/release/rf-agent", dest = "/usr/bin/rf-agent", mode = "755" },
    { source = "deploy/rf-agent.service", dest = "/usr/lib/systemd/system/rf-agent.service", mode = "644" },
]

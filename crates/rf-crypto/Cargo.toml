[package]
name = "rf-crypto"
description = "RavenFabric — Noise XX handshake, SecureChannel, key management"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
rust-version.workspace = true
categories = ["command-line-utilities", "network-programming"]
keywords = ["security", "remote-execution", "mesh-networking", "noise-protocol", "zero-trust"]

[dependencies]
snow = { workspace = true, optional = true }
rand = { workspace = true }
chacha20poly1305 = { workspace = true }
sha2 = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }
thiserror = { workspace = true }
tracing = { workspace = true, optional = true }
hex = { workspace = true }
cryptoki = { workspace = true, optional = true }
tss-esapi = { workspace = true, optional = true }
x25519-dalek = { workspace = true, optional = true }

[features]
default = ["std"]
std = ["snow", "tokio", "tracing", "serde_json"]
hsm = ["std", "dep:cryptoki", "dep:x25519-dalek"]
tpm = ["std", "dep:tss-esapi"]

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
tempfile = { workspace = true }
criterion = { workspace = true }

[[bench]]
name = "crypto_bench"
harness = false

[package]
name = "rf-executor"
description = "RavenFabric — Command execution under policy control"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
rust-version.workspace = true
categories = ["command-line-utilities", "network-programming"]
keywords = ["security", "remote-execution", "mesh-networking", "noise-protocol", "zero-trust"]

[features]
default = ["sysinfo"]
sysinfo = ["dep:sysinfo"]

[dependencies]
rf-policy = { path = "../rf-policy" }
rf-rpc = { path = "../rf-rpc" }
rf-audit = { path = "../rf-audit" }
rf-crypto = { path = "../rf-crypto" }
tokio = { workspace = true }
tracing = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
serde = { workspace = true }
sysinfo = { workspace = true, optional = true }
serde_json = { workspace = true }
base64 = { workspace = true }
sha2 = "0.10"

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }

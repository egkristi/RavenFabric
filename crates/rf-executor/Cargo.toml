[package]
name = "rf-executor"
description = "RavenFabric — Command execution under policy control"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
rust-version.workspace = true
categories = ["command-line-utilities", "network-programming"]
keywords = ["security", "remote-execution", "mesh-networking", "noise-protocol", "zero-trust"]

[features]
default = ["sysinfo"]
sysinfo = ["dep:sysinfo"]
wasm-plugins = ["dep:wasmtime"]

[dependencies]
rf-policy = { path = "../rf-policy", version = "0.8.0" }
rf-rpc = { path = "../rf-rpc", version = "0.8.0" }
rf-audit = { path = "../rf-audit", version = "0.8.0" }
rf-crypto = { path = "../rf-crypto", version = "0.8.0" }
tokio = { workspace = true }
tracing = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
serde = { workspace = true }
sysinfo = { workspace = true, optional = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
thiserror = { workspace = true }
regex = { workspace = true }
base64 = { workspace = true }
sha2 = { workspace = true }
httparse = { workspace = true }
wasmtime = { version = "36.0.9", optional = true, default-features = false, features = ["cranelift", "runtime"] }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }

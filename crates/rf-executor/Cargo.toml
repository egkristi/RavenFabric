[package]
name = "rf-executor"
description = "RavenFabric — Command execution under policy control"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
rust-version.workspace = true
categories = ["command-line-utilities", "network-programming"]
keywords = ["security", "remote-execution", "mesh-networking", "noise-protocol", "zero-trust"]

[features]
default = ["sysinfo", "secret-backends"]
sysinfo = ["dep:sysinfo"]
wasm-plugins = ["dep:wasmtime"]
secret-backends = []

[dependencies]
rf-policy = { path = "../rf-policy", version = "1.0.0-rc.4" }
rf-rpc = { path = "../rf-rpc", version = "1.0.0-rc.4" }
rf-audit = { path = "../rf-audit", version = "1.0.0-rc.4" }
rf-crypto = { path = "../rf-crypto", version = "1.0.0-rc.4" }
tokio = { workspace = true }
tracing = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
serde = { workspace = true }
sysinfo = { workspace = true, optional = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
thiserror = { workspace = true }
regex = { workspace = true }
base64 = { workspace = true }
sha2 = { workspace = true }
anyhow = { workspace = true }
hmac = { workspace = true }
hex = { workspace = true }
async-trait = { workspace = true }
zstd = { workspace = true }
httparse = { workspace = true }
wasmtime = { version = "46.0.1", optional = true, default-features = false, features = ["cranelift", "runtime"] }
reqwest = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }

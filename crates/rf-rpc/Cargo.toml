[package]
name = "rf-rpc"
description = "RavenFabric — RPC message types, multiplexer, codec"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
rust-version.workspace = true
categories = ["command-line-utilities", "network-programming"]
keywords = ["security", "remote-execution", "mesh-networking", "noise-protocol", "zero-trust"]

[dependencies]
rf-crypto = { path = "../rf-crypto", version = "0.1.6" }
rf-transport = { path = "../rf-transport", version = "0.1.6" }
tokio = { workspace = true }
tokio-util = { workspace = true, features = ["compat"] }
serde = { workspace = true }
serde_json = { workspace = true }
rmp-serde = { workspace = true }
rand = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }
yamux = { workspace = true }
futures-util = "0.3"
sha2 = "0.10"
rusqlite = { version = "0.35", features = ["bundled"], optional = true }

[features]
default = []
sqlite = ["dep:rusqlite"]

[dev-dependencies]
criterion = { workspace = true }
tempfile = "3"

[[bench]]
name = "codec_bench"
harness = false

[package]
name = "rf-relay"
description = "RavenFabric — Stateless encrypted relay broker"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
rust-version.workspace = true
categories = ["command-line-utilities", "network-programming"]
keywords = ["security", "remote-execution", "mesh-networking", "noise-protocol", "zero-trust"]

[dependencies]
rf-transport = { path = "../rf-transport", version = "0.11.0" }
tokio = { workspace = true }
tokio-tungstenite = { workspace = true }
tokio-util = { workspace = true }
futures-util = "0.3"
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
clap = { workspace = true, features = ["env"] }
thiserror = { workspace = true }
anyhow = "1"
hmac = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }

[package.metadata.deb]
maintainer = "Erling Kristiansen <erling@ravenfabric.io>"
section = "net"
priority = "optional"
assets = [
    ["target/release/rf-relay", "usr/bin/", "755"],
    ["../../deploy/rf-relay.service", "usr/lib/systemd/system/", "644"],
]

[package.metadata.generate-rpm]
assets = [
    { source = "target/release/rf-relay", dest = "/usr/bin/rf-relay", mode = "755" },
    { source = "deploy/rf-relay.service", dest = "/usr/lib/systemd/system/rf-relay.service", mode = "644" },
]

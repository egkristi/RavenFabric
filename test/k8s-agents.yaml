apiVersion: v1
kind: Pod
metadata:
  name: rf-agent-1
  labels:
    app: rf-agent
    agent: "1"
spec:
  restartPolicy: Always
  containers:
  - name: agent
    image: ubuntu:24.04
    command: ["/bin/bash", "-c"]
    args:
    - |
      apt-get update -qq && apt-get install -y -qq curl
      curl -fsSL -o /usr/local/bin/rf-agent https://github.com/egkristi/RavenFabric-Published/releases/download/v1.0.0-rc.6/ravenfabric-linux-amd64-musl-agent
      chmod +x /usr/local/bin/rf-agent
      mkdir -p /etc/ravenfabric
      exec /usr/local/bin/rf-agent --relay ws://rf-relay.ravenfabric.svc.cluster.local:9090 --token agent1 --id agent-1 --policy-path /etc/ravenfabric/policy.yaml --audit-path /var/log/rf-audit.jsonl
    volumeMounts:
    - name: policy
      mountPath: /etc/ravenfabric
  volumes:
  - name: policy
    configMap:
      name: rf-agent-policy

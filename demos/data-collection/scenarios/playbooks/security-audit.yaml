# Security audit — check for common misconfigurations
command: |
  echo "=== Security Audit ==="
  echo "user: $(whoami)"
  echo "suid_binaries: $(find /usr -perm -4000 -type f 2>/dev/null | wc -l)"
  echo "world_writable: $(find /etc -perm -o+w -type f 2>/dev/null | wc -l)"
  echo "login_users: $(cat /etc/passwd | grep -v nologin | grep -v false | wc -l)"
  echo "listening_ports: $(ss -tlnp 2>/dev/null | grep LISTEN | wc -l)"
  echo "=== Done ==="
target: !agents [rf-collector, rf-webserver, rf-database]
strategy: parallel
on_failure: continue
timeout_secs: 30

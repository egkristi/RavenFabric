apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: ravenpolicies.ravenfabric.io
  labels:
    app.kubernetes.io/name: ravenfabric
    app.kubernetes.io/part-of: ravenfabric
spec:
  group: ravenfabric.io
  names:
    kind: RavenPolicy
    listKind: RavenPolicyList
    plural: ravenpolicies
    singular: ravenpolicy
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          description: RavenPolicy declares a deny-by-default policy applied to agents.
          required: ["spec"]
          properties:
            spec:
              type: object
              description: Policy spec in the same shape as policy.yaml.
              x-kubernetes-preserve-unknown-fields: true
            status:
              type: object
              x-kubernetes-preserve-unknown-fields: true
              description: Observed state, populated by the operator.
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp

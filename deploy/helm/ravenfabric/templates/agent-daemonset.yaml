{{- if .Values.agent.enabled }}
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ include "ravenfabric.fullname" . }}-agent
  labels:
    app.kubernetes.io/name: {{ include "ravenfabric.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: agent
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "ravenfabric.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: agent
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "ravenfabric.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: agent
    spec:
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "ravenfabric.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.securityContext | nindent 8 }}
      containers:
        - name: agent
          image: "{{ .Values.agent.image.repository }}:{{ .Values.agent.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.agent.image.pullPolicy }}
          args:
            - "--relay"
            - "{{ .Values.agent.relayUrl }}"
            - "--id"
            - "$(NODE_NAME)"
            - "--config"
            - "/etc/ravenfabric/raven.toml"
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: RUST_LOG
              value: {{ .Values.relay.logLevel }}
          volumeMounts:
            - name: config
              mountPath: /etc/ravenfabric
              readOnly: true
            - name: audit
              mountPath: /var/log/ravenfabric
          resources:
            {{- toYaml .Values.resources.agent | nindent 12 }}
          livenessProbe:
            exec:
              command: ["/rf-agent", "--health"]
            initialDelaySeconds: 10
            periodSeconds: 30
      volumes:
        - name: config
          configMap:
            name: {{ include "ravenfabric.fullname" . }}-config
        - name: audit
          emptyDir:
            sizeLimit: 100Mi
{{- end }}

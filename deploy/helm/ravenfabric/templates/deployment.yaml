apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ravenfabric.fullname" . }}-relay
  labels:
    app.kubernetes.io/name: {{ include "ravenfabric.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: relay
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "ravenfabric.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: relay
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "ravenfabric.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: relay
    spec:
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "ravenfabric.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.securityContext | nindent 8 }}
      containers:
        - name: relay
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: relay
              containerPort: 9090
              protocol: TCP
          env:
            - name: RUST_LOG
              value: {{ .Values.relay.logLevel }}
            {{- if .Values.relay.meetSecret }}
            - name: RELAY_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "ravenfabric.fullname" . }}-secret
                  key: meet-secret
            {{- end }}
          resources:
            {{- toYaml .Values.resources.relay | nindent 12 }}
          livenessProbe:
            tcpSocket:
              port: relay
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            tcpSocket:
              port: relay
            initialDelaySeconds: 3
            periodSeconds: 5

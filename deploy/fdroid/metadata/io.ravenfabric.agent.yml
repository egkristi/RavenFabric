Name: RavenFabric Agent
AutoName: RavenFabric

Summary: Secure remote execution and mesh networking agent

Description: |
  RavenFabric is a secure remote execution and mesh networking agent written in
  Rust. It replaces Tailscale, Ansible, Salt, and similar tools with a single,
  cryptographically verified binary.

  Features:
  * Noise XX mutual authentication (no certificates, no TLS)
  * Deny-by-default policy engine
  * Structured JSON-lines audit logging
  * 30+ transport drivers (WebSocket, QUIC, LoRa, BLE, satellite, mixnet)
  * Post-quantum hybrid key exchange
  * Single static binary, no runtime dependencies
  * Works on Android natively (Termux or foreground service)

  The agent connects to a relay or mesh peers and executes policy-controlled
  commands. All actions are cryptographically authenticated and audit-logged.


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ravenfabric"
version = "1.0.0-rc.3"
description = "Python MCP client SDK for RavenFabric secure remote execution"
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
authors = [{ name = "RavenFabric Contributors" }]
keywords = ["mcp", "remote-execution", "security", "ravenfabric"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Systems Administration",
    "Topic :: Security",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://ravenfabric.io"
Repository = "https://github.com/egkristi/RavenFabric"
Documentation = "https://ravenfabric.io/docs/"

[tool.hatch.build.targets.wheel]
packages = ["src/ravenfabric"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.mypy]
strict = true
python_version = "3.9"

[workspace]
resolver = "2"
members = [
    "crates/rf-crypto",
    "crates/rf-transport",
    "crates/rf-rpc",
    "crates/rf-audit",
    "crates/rf-policy",
    "crates/rf-executor",
    "crates/rf-bootstrap",
    "crates/rf-relay",
    "crates/rf-agent",
    "crates/rf-cli",
    "crates/rf-integration-tests",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
repository = "https://github.com/egkristi/RavenFabric"
homepage = "https://github.com/egkristi/RavenFabric"
authors = ["Erling Kristiansen"]
description = "Secure remote execution and mesh networking agent — zero-trust, cryptographically verified"
rust-version = "1.85"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "allow"
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
return_self_not_must_use = "allow"
cast_precision_loss = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
doc_markdown = "allow"
similar_names = "allow"
wildcard_imports = "allow"

[workspace.dependencies]
# Async
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"

# Crypto
snow = "0.9"
rand = "0.8"
chacha20poly1305 = "0.10"

# Transport
tokio-tungstenite = { version = "0.24", features = ["native-tls"] }
yamux = "0.13"
quinn = "0.11"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
rcgen = "0.13"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
rmp-serde = "1"

# Policy
regex = "1"

# Logging / Tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }

# Error handling
thiserror = "2"
anyhow = "1"

# CLI
clap = { version = "4", features = ["derive"] }
clap_complete = "4"

# Utilities
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
hex = "0.4"
hmac = "0.12"
sha2 = "0.11"
tokio-util = { version = "0.7", features = ["rt"] }
toml = "0.8"
base64 = "0.22"

# Platform
libc = "0.2"

# System info
sysinfo = "0.32"

# JSON (for audit logger)
serde_json = "1"

# Benchmarking
criterion = { version = "0.5", features = ["html_reports"] }

# Temp files (for tests)
tempfile = "3"

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"

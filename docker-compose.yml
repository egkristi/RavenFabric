# RavenFabric — Docker Compose
#
# Runs RavenFabric in dev mode (relay + agent in one process, permissive policy).
# Connect from your local machine or use the CLI container.
#
# Usage:
#   docker compose up -d
#   rf exec --token dev "uname -a"                                  # from host
#   docker compose exec cli rf exec --token dev "uname -a"          # from CLI container
#   docker compose down

services:
  ravenfabric:
    build:
      context: .
      dockerfile: Dockerfile
      target: cli
    ports:
      - "9090:9090"
    command: ["dev", "--bind", "0.0.0.0", "--port", "9090"]
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  cli:
    build:
      context: .
      dockerfile: Dockerfile
      target: cli
    depends_on:
      - ravenfabric
    entrypoint: ["/bin/sh", "-c", "echo 'RavenFabric CLI ready. Use: docker compose exec cli rf exec --token dev <command>' && sleep infinity"]
    security_opt:
      - no-new-privileges:true
